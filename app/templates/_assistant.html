{# The assistant, ported from ai-avatar-app: the robot sits at the top of the panel. #}
<div class="avatar-dock">
  <div class="avatar-status" id="avatar-status" aria-live="polite"></div>
  <div id="robot" class="robot" role="button" tabindex="0" aria-label="Open the assistant">
    <div id="robot-3d" class="robot-3d"></div>
  </div>
  <div class="avatar-glow" aria-hidden="true"></div>
</div>

<div class="hero-chat open" id="chat-panel" role="complementary" aria-label="Assistant"
     data-chat-url="/api/recordings/{{ rec.slug }}/chat"
     data-status-url="/api/recordings/{{ rec.slug }}"
     data-slug="{{ rec.slug }}"
     data-frames="{{ rec.frames_status }}">
  <div class="chat-head">
    <div class="chat-id">
      <span class="chat-dot"></span>
      <div>
        <strong>Bot Assistant</strong>
        <span class="chat-context">Ask about what happened in this recording</span>
      </div>
    </div>
    <div class="chat-head-actions">
      <button type="button" class="chat-close" id="voice-btn" aria-pressed="true" title="Read replies aloud">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
      </button>
      <button type="button" class="chat-close" id="close-chat-btn" aria-label="Close chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  </div>

  <div class="chat-stage" aria-hidden="true"></div>

  <section id="chat-screen" class="screen">
    <div id="frames-note" class="frames-note" hidden></div>
    <div id="log" class="log"></div>

    <div class="suggestions">
      <button type="button" data-ask="What happened in this run?">&gt; What happened</button>
      <button type="button" data-ask="Where did it go wrong, if anywhere?">&gt; Where it failed</button>
      <button type="button" data-ask="Was the bet actually placed? Show me when.">&gt; The bet</button>
      <button type="button" data-ask="Does the bet history match the bet?">&gt; Bet history</button>
    </div>

    <form id="chat-form" class="chat-form">
      <button type="button" id="mic-btn" title="Speak">🎤︎︎</button>
      <input id="chat-input" type="text" placeholder="Type or press the mic..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ asset('robot.js') }}"></script>
<script src="{{ asset('assistant.js') }}"></script>
