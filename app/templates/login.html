{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form class="card login" method="post" action="/login">
  <h1>Log in</h1>
  <p class="muted">Enter the team password to view recordings.</p>
  <input type="hidden" name="next" value="{{ next }}">
  <input type="password" name="password" placeholder="Team password" autocomplete="current-password" autofocus required>
  {% if error %}<p class="login-error" role="alert">Wrong password.</p>{% endif %}
  <button class="btn" type="submit">Log in</button>
</form>
{% endblock %}
